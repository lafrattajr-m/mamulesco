<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mamulesco - Site em Desenvolvimento</title>
<meta name="description" content="Mamulesco: novidades em breve. Acompanhe nosso conteúdo no Instagram.">
<meta name="theme-color" content="#0d1b2a">
<link rel="icon" href="imgs/logo_mamulesco.png" type="image/png">
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark;--accent:#FAD266;--accent2:#65c88e;--bg:#0d1b2a}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;color:#f9f9fb;background:radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--accent2) 15%,transparent),transparent 55%),linear-gradient(165deg,var(--bg),#070c17)}
main{width:min(100%,710px);padding:clamp(30px,7vw,65px) 24px;text-align:center;border:1px solid #ffffff24;border-radius:28px;background:linear-gradient(140deg,#ffffff0e,#ffffff04);box-shadow:0 25px 90px #0007}
.logo{display:block;max-width:min(58vw,240px);max-height:220px;width:auto;height:auto;object-fit:contain;margin:0 auto 26px;filter:drop-shadow(0 12px 25px #0005)}
.pill{display:inline-block;padding:9px 18px;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:99px;color:var(--accent);letter-spacing:.15em;text-transform:uppercase;font-size:.76rem;font-weight:750}
h1{font-size:clamp(2.2rem,7vw,4rem);letter-spacing:-.05em;margin:24px 0 10px;line-height:1.1}
h2{font-size:clamp(1.13rem,3.5vw,1.48rem);font-weight:500;color:var(--accent);margin:0}
p{max-width:480px;margin:20px auto 30px;color:#c4cad4;line-height:1.7;font-size:1.02rem}
a.cta{display:inline-flex;gap:10px;align-items:center;justify-content:center;text-decoration:none;color:#101522;background:linear-gradient(110deg,var(--accent),var(--accent2));padding:15px 27px;border-radius:99px;font-weight:750;transition:transform .2s,box-shadow .2s}
a.cta:hover,a.cta:focus-visible{transform:translateY(-2px);box-shadow:0 8px 26px color-mix(in srgb,var(--accent) 28%,transparent)}
footer{margin-top:36px;color:#97a1af;font-size:.8rem}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<img class="logo" src="imgs/logo_mamulesco.png" alt="Logotipo Mamulesco" width="240" height="220">
<span class="pill">Novidades em breve</span>
<h1>Mamulesco</h1>
<h2>Uma nova experiência está chegando.</h2>
<p>Estamos preparando novidades. Enquanto isso, acompanhe nosso conteúdo no Instagram.</p>
<a class="cta" href="https://www.instagram.com/mamulesco" target="_blank" rel="noopener noreferrer">Acompanhe @mamulesco ↗</a>
<footer>© <span id="year">2026</span> Mamulesco. Todos os direitos reservados.</footer>
</main>
<script>document.getElementById("year").textContent=new Date().getFullYear()</script>
</body>
</html>
